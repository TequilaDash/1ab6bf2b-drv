name: build-ave2-exploit

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'scripts/**'
      - 'resources/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Makefile'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun clang --version | head -1

      - name: Install ldid
        run: |
          brew install ldid
          ldid -V 2>&1 | head -1 || true

      - name: Build exploit (arm64, iOS)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang -O2 -g -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            src/ave2_exploit.c -o ave2_exploit \
            -framework CoreFoundation
          file ave2_exploit
          ls -la ave2_exploit

      - name: Build reach PoC (arm64e, IOKit direct)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang -O0 -g -arch arm64e -isysroot "$SDK" \
            -framework IOKit -framework CoreFoundation \
            src/poc_ave2_reach.c -o poc_ave2_reach
          file poc_ave2_reach

      - name: Build registry scan tool (arm64, iOS)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang -O2 -g -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            src/ave2_scan.c -o ave2_scan \
            -framework CoreFoundation
          file ave2_scan

      - name: Build create-probe (arm64, iOS)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang -O2 -g -arch arm64 -isysroot "$SDK"             -miphoneos-version-min=14.0             src/ave2_probe_create.c -o ave2_probe_create             -framework CoreFoundation
          file ave2_probe_create

      - name: Sign exploit with entitlements (ldid)
        run: |
          ldid -Sresources/entitlements.plist ave2_exploit
          ldid -Sresources/entitlements.plist ave2_scan
          ldid -Sresources/entitlements.plist ave2_probe_create
          ldid -e ave2_exploit | head -20

      - name: Package ipa
        run: |
          STAGE=$(mktemp -d)
          APP="$STAGE/Payload/ave2_exploit.app"
          mkdir -p "$APP"
          cp ave2_exploit "$APP/ave2_exploit"
          cp resources/Info.plist "$APP/Info.plist"
          cd "$STAGE"
          zip -qr "$GITHUB_WORKSPACE/ave2_exploit.ipa" Payload
          unzip -l "$GITHUB_WORKSPACE/ave2_exploit.ipa"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ave2-exploit-release
          path: |
            ave2_exploit
            ave2_scan
            ave2_probe_create
            poc_ave2_reach
            ave2_exploit.ipa
