name: build-ave2-exploit

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_*.app ]; then
            sudo xcode-select -s "/Applications/Xcode_*.app"
          else
            sudo xcode-select -s /Applications/Xcode.app || true
          fi
          xcode-select -p

      - name: Show toolchain
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun clang --version | head -1
          xcrun clang -print-targets | grep -iE 'arm64|aarch64' | head -5

      - name: Compile exploit (arm64e)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          xcrun clang -O0 -g -arch arm64e -isysroot "$SDK" \
            -framework IOKit -framework CoreFoundation \
            src/ave2_exploit.c -o ave2_exploit 2>&1
          echo "exit=$?"
          file ave2_exploit || true
          ls -la ave2_exploit || true

      - name: Compile reach PoC (arm64e)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang -O0 -g -arch arm64e -isysroot "$SDK" \
            -framework IOKit -framework CoreFoundation \
            src/poc_ave2_reach.c -o poc_ave2_reach 2>&1
          echo "exit=$?"
          file poc_ave2_reach || true
          ls -la poc_ave2_reach || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ave2-exploit-binaries
          path: |
            ave2_exploit
            poc_ave2_reach
